name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to retry"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        id: metadata
        run: GITHUB_REF_NAME="$RELEASE_TAG" node ./scripts/verify-release-tag.mjs

      - name: Verify and build release
        run: bun run verify

      - name: Pack npm artifact
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts --ignore-scripts

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/release-draft-state 2>/dev/null; then
            if ! grep -qx 'true' /tmp/release-draft-state; then
              echo "GitHub Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            release_flags=(--draft --verify-tag --generate-notes --title "$RELEASE_TAG")
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.tgz --clobber

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_SPEC: ${{ steps.metadata.outputs.package_spec }}
        run: |
          if npm view "$PACKAGE_SPEC" version --silent > /dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already published; skipping npm publish."
          else
            npm publish ./artifacts/*.tgz --access public --provenance --ignore-scripts
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
